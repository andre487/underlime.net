<div id=project-view><section id=project-details data-ul-tabs=""><div id=project-details-top><div id=project-details-platforms data-ng-if=link_game><span class=label>{{ messages.current_version }}:</span> <a data-ng-href={{link_game}} class=current-version-link target=_blank rel=noopener>{{ messages.play }}</a></div><ul class="horizontal-menu ul-tabs-switch"><li><a href=#project-description>{{ messages.description }}</a><li data-ng-show=pictures><a href=#project-pictures>{{ messages.pictures }}</a><li data-ng-show=manual><a href=#project-manual>{{ messages.manual }}</a></ul><div class="border-separator clear"></div></div><div class=ui-tabs-container><section id=project-description class=ul-tab><div id=project-top data-ng-controller=ProjectBannerController></div><header class=project-header-content><div class=clear></div><h1 class=project-header>{{ name }}</h1><div class=project-additional-data><div class=project-additional-item data-ng-show=release_date><span class=label>{{ messages.release_date }}:</span> <span class=value>{{ release_date | date }}</span></div><div class=project-additional-item data-ng-show=genre><span class=label>{{ messages.genre }}:</span> <span class=value>{{ genre }}</span></div></div><div class=project-shares-block><div class=share-widget><div id=vk_like></div></div></div><div class=clear></div></header><div class=tab-content data-ng-bind-html-unsafe=text></div></section><section id=project-pictures class=ul-tab><div id=project-pictures-gallery data-ui-galleria=""><div data-ng-repeat="picData in pictures"><a data-ng-href="{{ picData.image }}"><img alt="" data-ng-src="{{ picData.thumbnail }}"></a></div></div></section><section id=project-manual class=ul-tab><div class=tab-content data-ng-bind-html-unsafe=manual></div></section></div></section></div>
